services:
  api:
    build: .
    env_file: .env
    # Ollama runs on the host and listens on 127.0.0.1, which only the host network can reach.
    network_mode: host
    volumes:
      - ./data:/app/data
      - ./.cache:/app/.cache
      - ./mlflow.db:/app/mlflow.db
      # mlflow.db stores absolute paths to the model files, so they must be at the same path as on the host.
      - ./mlruns:${PWD}/mlruns
