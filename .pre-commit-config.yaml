default_install_hook_types: [pre-commit, pre-push]

# Local hooks run the tools through uv, so they use the exact versions pinned in uv.lock.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: unsupported
        types: [python]
        stages: [pre-commit]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: unsupported
        types: [python]
        stages: [pre-commit]
      - id: pytest
        name: pytest
        entry: uv run pytest
        language: unsupported
        pass_filenames: false
        always_run: true
        stages: [pre-push]
